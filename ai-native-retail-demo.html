<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Native Retail Demo</title>
<script>
/* set theme before first paint */
(function(){var t='light';try{t=localStorage.getItem('ainr-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--ink:#161b22;--ink2:#465061;--ink3:#667182;--line:#dfe3ea;--accent:#2457d6;--accent2:#1c45ad;--on-accent:#fff;--accent-soft:#e6edfc;--good:#14764a;--good-soft:#e1f3ea;--warn:#8a5a00;--warn-soft:#fdf0d2;--crit:#b3261e;--crit-soft:#fbe6e4;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1319;--surface:#171c24;--surface2:#202733;--ink:#eaeef5;--ink2:#b0b9c7;--ink3:#8f99a9;--line:#2b3340;--accent:#7ba3ff;--accent2:#a3bfff;--on-accent:#0d1626;--accent-soft:#1c2a47;--good:#4cc790;--good-soft:#14301f;--warn:#f0b84a;--warn-soft:#352a10;--crit:#ff8a80;--crit-soft:#3a1c1a;--sh:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;color:var(--ink);text-decoration:none;font-size:16px}
.logo{width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;display:inline-block}
.logo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--on-accent)}
.grow{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.role select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:600;max-width:230px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
nav.tabs a{padding:9px 13px;text-decoration:none;color:var(--ink2);font-weight:550;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current=page]{color:var(--accent);border-color:var(--accent)}
.waiting-chip{font-size:13px;font-weight:650;padding:5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
/* generic */
main{padding:28px 0 90px;outline:none}
.h1{font-size:clamp(26px,3.4vw,38px);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.h2{font-size:21px;font-weight:680;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:650}
.muted{color:var(--ink2)}.small{font-size:13px}.faint{color:var(--ink3)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.bad{color:var(--crit)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-w{background:var(--surface2);color:var(--ink2)}
.s-f{background:var(--warn-soft);color:var(--warn)}
.s-n{background:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--surface2);color:var(--ink2)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.crit{background:var(--crit-soft);color:var(--crit)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* hero + north star */
.hero{padding:34px 0 8px;max-width:900px}
.hero p{font-size:18px;margin-top:12px;color:var(--ink2);max-width:720px}
.flowwrap{overflow-x:auto;padding:6px 2px 14px;margin:0 -2px}
.flow{display:grid;grid-template-columns:repeat(13,minmax(116px,1fr));gap:0;min-width:max-content}
@media(min-width:1280px){.flow{min-width:0;grid-template-columns:repeat(13,minmax(0,1fr))}.node{padding:10px 8px;margin-right:8px}.node .nm{font-size:13px}.node::after{right:-9px;width:9px}}
.node{position:relative;margin:0 9px 0 0;padding:12px 11px;border:1px solid var(--line);background:var(--surface);border-radius:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;box-shadow:var(--sh)}
.node::after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:2px;background:var(--line)}
.node:last-child::after{display:none}
.node:hover,.node[aria-pressed=true]{border-color:var(--accent)}
.node[aria-pressed=true]{background:var(--accent-soft)}
.node .no{font-size:11px;color:var(--ink3);font-weight:700}
.node .nm{font-weight:650;font-size:14px;line-height:1.25}
.node .ct{font-size:12px;color:var(--ink2);margin-top:auto}
.node .dw{font-size:12px;font-weight:700;color:var(--accent)}
.node .dw.none{color:var(--ink3);font-weight:600}
.tagline{font-size:clamp(20px,2.4vw,26px);font-weight:650;letter-spacing:-.01em;margin:6px 0 4px}
.stat{padding:16px 18px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink2)}
/* agent card */
.agent{position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.agent:hover{border-color:var(--accent)}
.stretch{all:unset;cursor:pointer;font-weight:650;font-size:16px;line-height:1.3}
.stretch::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.stretch:focus-visible::after{outline:3px solid var(--accent);outline-offset:2px}
.agent .job{font-size:13px;color:var(--ink2)}
.agent .find{font-size:14px;margin-top:2px}
.agent .meta{margin-top:auto;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px;padding-top:6px}
/* decision card */
.dcard{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);padding:14px 16px}
.dcard .ask{margin-top:8px;padding:9px 12px;background:var(--accent-soft);border-radius:8px;font-weight:600;font-size:14px}
.dcard .why{font-size:13px;color:var(--ink2);margin-top:8px}
.ev{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.ev li{margin:2px 0}
.done-d{opacity:.8;border-left-color:var(--good)}.done-d.rej{border-left-color:var(--crit)}
/* kpi */
.kpi{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:600}
.kpi svg{width:100%;height:34px;margin-top:6px}
.delta{font-size:12px;font-weight:650}
.delta.good{color:var(--good)}.delta.bad{color:var(--crit)}.delta.flat{color:var(--ink3)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
/* lists */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border:0}
.feed time{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:13px;font-weight:600}
.bul{list-style:none;margin:0;padding:0;counter-reset:b}
.bul li{counter-increment:b;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.bul li:last-child{border:0}
.bul li::before{content:counter(b);width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
/* table */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;white-space:nowrap;background:var(--surface)}
.tbl th button{all:unset;cursor:pointer;font-weight:700}
.tbl th button:focus-visible{outline:3px solid var(--accent)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
/* bars */
.track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.track.good>i{background:var(--good)}
.cmp{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.cmp .track>i.bf{background:var(--ink3)}
/* forms */
label.f{display:block;font-size:13px;font-weight:650;margin-bottom:4px}
.in,textarea.in,select.in{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);}
textarea.in{min-height:84px;resize:vertical}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.switch button{border:0;background:transparent;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.switch button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.radio{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;align-items:flex-start}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--crit);font-size:13px;font-weight:600;margin-top:6px}
/* layers */
.layer{position:fixed;inset:0;z-index:60;display:flex}
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.5)}
.layer .panel{position:relative;background:var(--surface);color:var(--ink);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);outline:none}
.layer.drawer{justify-content:flex-end}
.layer.drawer .panel{width:min(560px,100%);height:100%;border-left:1px solid var(--line)}
.layer.modal{align-items:center;justify-content:center;padding:16px}
.layer.modal .panel{width:min(600px,100%);max-height:92vh;border-radius:16px;border:1px solid var(--line)}
.pbody{padding:24px 24px 28px}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.anim .panel{animation:in .2s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.layer.drawer.anim .panel{animation:inr .22s ease-out}
@keyframes inr{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:104px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.t{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* stepper / workflow */
.wfgrid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wfgrid{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0;position:relative;font-size:14px}
.steps li::before{content:"";position:absolute;left:12px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);z-index:1}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.steps li.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.wait .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.todo{color:var(--ink3)}
.log{font-size:13px;list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--ink3);font-variant-numeric:tabular-nums}
.who{font-weight:650}
/* swimlane */
.lane{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.lt{position:relative;height:16px;background:var(--surface2);border-radius:5px;overflow:hidden}
.lt i{position:absolute;top:0;bottom:0}
.lt .a{background:var(--warn);opacity:.75}.lt .b{background:var(--accent)}.lt .c{background:var(--good)}
.lt .cur{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.dtrack{position:relative;height:12px;border-radius:99px;background:var(--surface2)}
.dtrack>i.p{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.dtrack>b{position:absolute;top:-3px;width:3px;height:18px;border-radius:2px;background:var(--ink3);opacity:.7}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:4px}
/* tree */
.tree,.tree ul{list-style:none;margin:0;padding-left:0}
.tree ul{padding-left:18px;border-left:2px solid var(--line);margin-left:6px}
.tree li{margin:6px 0}
.tree details>summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 10px;border-radius:8px;background:var(--surface2);list-style:none}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"+";font-weight:700;width:14px;color:var(--ink3)}
.tree details[open]>summary::before{content:"\2212"}
.tree .leaf{padding:7px 10px;border-radius:8px;background:var(--surface2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tree .val{font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
/* presenter */
#presenter{position:fixed;right:16px;bottom:16px;z-index:50;width:min(380px,calc(100% - 32px))}
.pcard{padding:16px 18px;border:1px solid var(--accent)}
.dots{display:flex;gap:6px;margin:8px 0}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.spot{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px;animation:spot 1.6s ease-in-out 3}
@keyframes spot{50%{outline-color:transparent}}
.sc-btn{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.sc-btn span{font-weight:400;font-size:12.5px;color:var(--ink2)}
.pass,.fail{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.pass{background:var(--good-soft);color:var(--good)}.fail{background:var(--crit-soft);color:var(--crit)}
.callout{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:550}
footer{padding:20px 0 40px;color:var(--ink3);font-size:13px}
.layer.drawer.wide .panel{width:min(780px,100%)}
.brief{margin-bottom:-28px}.brief h3.h3{margin:26px 0 8px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
tr.rec td{background:var(--accent-soft)}
.bactions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 0;margin-top:26px;display:flex;gap:10px;flex-wrap:wrap;z-index:2}
details.qa{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:8px}details.qa summary{cursor:pointer;padding:11px 0;font-weight:600}details.qa p{margin:0 0 12px;color:var(--ink2)}
.wiout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}.wiout>div{background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2)}.wiout b{display:block;font-size:18px;color:var(--ink)}
.wiout .good b{color:var(--good)}.wiout .crit b{color:var(--crit)}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:640px){.two{grid-template-columns:1fr}}
.imp{font-size:13px;color:var(--ink2);margin-top:8px}
.agent.shared{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.btabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:16px 0 0}
.btab{border:0;background:transparent;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;font-size:14px}
.btab[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:12px}
.clog{max-height:calc(100vh - 390px);min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.mu{align-self:flex-end;background:var(--accent);color:var(--on-accent);padding:9px 13px;border-radius:14px 14px 4px 14px;max-width:85%}
.ma{align-self:flex-start;background:var(--surface2);border-radius:14px 14px 14px 4px;padding:10px 13px;max-width:94%;border-left:3px solid var(--ink3);font-size:14px}
.ma.shared{border-left-color:var(--accent);background:var(--accent-soft)}
.mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:4px}
.csug{display:flex;gap:8px;flex-wrap:wrap}.csug .chip{padding:7px 12px;font-size:13px;text-align:left;border-radius:14px}
.cform{display:flex;gap:8px}.cform .in{flex:1}
.dots3 i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-left:4px;animation:bl 1.2s infinite}.dots3 i:nth-child(2){animation-delay:.2s}.dots3 i:nth-child(3){animation-delay:.4s}

<script>
'use strict';
/* =====================================================================
   SYNTHETIC DATA BLOCK  -  everything below is made up for illustration.
   Swap the placeholders in CONFIG / ZONES / SUPPLIERS / CATEGORIES first.
   Search the file for "BASELINES" to find the figures to replace with
   measured baselines later.
   ===================================================================== */
const CONFIG = { COUNTRY: 'Chile', CURRENCY: 'USD', SEED: 20240611 };
const ZONES = ['Zone 1', 'Zone 2', 'Zone 3', 'Zone 4', 'Zone 5', 'Zone 6'];
const ZONE_SHARE = [0.22, 0.19, 0.17, 0.16, 0.14, 0.12];            // share of GMV, sums to 1
const SUPPLIERS = ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D', 'Supplier E', 'Supplier F', 'Supplier G', 'Supplier H', 'Supplier I', 'Supplier J', 'Supplier K', 'Supplier L'];
const CATEGORIES = ['Fresh produce', 'Dairy and eggs', 'Bakery', 'Meat and fish', 'Packaged food', 'Beverages', 'Household', 'Personal care'];
const C = CONFIG.CURRENCY;
const CTRY = CONFIG.COUNTRY;
const [Z1, Z2, Z3, Z4, Z5, Z6] = ZONES;
const [SA, SB, SC, SD, SE, SF, SG, SH, SI, SJ, SK, SL] = SUPPLIERS;
const [CAT_FRESH, CAT_DAIRY, CAT_BAKERY, CAT_MEAT, CAT_PACK, CAT_BEV, CAT_HOME, CAT_CARE] = CATEGORIES;

/* seeded generator so every reload shows the same numbers */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(CONFIG.SEED);
const ri = (a, b) => Math.round(a + R() * (b - a));

/* ---------- the chain, supplier to shelf ---------- */
const STAGES = ['Contract', 'Catalogue', 'Assortment', 'Pricing and margin', 'Forecast', 'Buy', 'Supplier follow-up', 'Inbound', 'Transfer', 'Store', 'Pick and pack', 'Customer', 'Learn'];
const ST = n => STAGES.indexOf(n);

/* ---------- the people ---------- */
const PERSONAS = [
  { id: 'ch', name: 'Country head', who: 'You', blurb: 'Your whole market on one page: what moved, why, and the few things that need you.',
    kpis: [['Orders expected today', '41,200', '+2.2% vs yesterday'], ['Zones on track', '4 of 6', 'Zones 3 and 5 need attention'], ['Decisions waiting for you', null, 'ranked by money at risk']],
    happened: [`Zone 3 sales ran 11% below usual yesterday, mostly dairy and fresh stock-outs in the evening.`, `Competitor X cut ${CAT_BEV} and ${CAT_DAIRY} prices by 15% for the weekend in three zones.`, `${SD} sent a cost list that takes 14 items below the margin floor.`, `Inventory days are 41 against 36 payment days, 5 days of cash tied up.`, `${SL}'s food licence expires in 12 days and 31 items are missing product data.`] },
  { id: 'cat', name: 'Commercial lead and Catman', who: 'Commercial lead', blurb: 'Your portfolio, your suppliers, your margin. Agents prepare, you negotiate.',
    kpis: [['Portfolio margin', '25.3%', 'floor is 21.0%'], ['Items below floor', '14', 'all from one supplier'], ['Supplier meetings this week', '5', 'briefs ready for 4']],
    happened: [`${SD} price list expires in 2 days, with a 6.5% cost rise on ${CAT_DAIRY}.`, `3 opportunities found in ${CAT_DAIRY}: 6 yoghurt items missing in 4 zones.`, `${SK}'s credit-line pack is 9 of 11 documents complete.`] },
  { id: 'dp', name: 'Demand planner', who: 'Demand planner', blurb: 'Clean data in, trusted forecasts out. Edits get a reason and a score.',
    kpis: [['Forecast accuracy', '82%', 'yesterday, all categories'], ['Items with data gaps', '37', 'filled, awaiting your check'], ['Manual edits this week', '19', '12 improved the forecast']],
    happened: [`${CAT_FRESH} forecast in ${Z1} ran 28% too high for 3 days.`, `37 items had sales gaps after stores closed early.`, `5 manual edits this week had no written reason.`] },
  { id: 'buy', name: 'Buyer', who: 'Buyer', blurb: 'No blocked plans, no unanswered orders, no surprise holidays.',
    kpis: [['Buy lines blocked', '27', '19 links, 8 cost prices'], ['Orders confirmed in 24 h', '68%', 'target 90%'], ['Suppliers yet to reply', '4', '1 is critical']],
    happened: [`27 buy lines are blocked: 19 missing supplier links, 8 missing cost prices.`, `11 purchase orders are not confirmed after 24 hours.`, `${SG} has not replied about the delayed truck.`] },
  { id: 'wh', name: 'Replenishment and warehouse lead', who: 'Replenishment lead', blurb: 'Moves stock to where customers will want it, on time.',
    kpis: [['Transfers planned for tomorrow', '62', 'across 4 zones'], ['Trucks due today', '23', '1 delayed'], ['Stock count accuracy', '96.2%', `${Z4} dairy at 91%`]],
    happened: [`${SG}'s truck is 3 hours late, affecting ${Z2} and ${Z3}.`, `Two trucks booked on the same dock at 10:00.`, `Shelf counts differ from the system by 3.8% for ${Z4} dairy.`] },
  { id: 'store', name: 'Zone lead and dark-store manager', who: 'Dark-store manager', blurb: 'Your store, your shift, your shelf. Agents tell you what to do next.',
    kpis: [['Units per picker per hour', '118', 'target 125'], ['Items out of stock now', '6', `store Z3-02`], ['Items expiring tonight', '48', 'bakery']],
    happened: [`6 items are out of stock in store Z3-02, substitutes are ready.`, `Evening shift in ${Z5} is 2 pickers short from 18:00.`, `48 bakery items expire tonight.`] },
  { id: 'fin', name: 'Finance lead', who: 'Finance lead', blurb: 'Match the paper, time the cash, free up working capital.',
    kpis: [['Invoices not matching', '23', `difference ${C} 18,400`], ['Payment days (average)', '36', 'terms vary by supplier'], ['Excess stock above target', `${C} 310k`, 'mostly household']],
    happened: [`23 invoices do not match goods received, total difference ${C} 18,400.`, `${SK}'s credit-line pack needs your review.`, `Excess stock above target is worth ${C} 310k.`] },
  { id: 'gro', name: 'Growth lead', who: 'Growth lead', blurb: 'Fill the gaps, move the excess, plan the next campaign.',
    kpis: [['Neighbourhoods outside 15 min', '4', `in ${Z6}`], ['Campaigns planned', '3', 'one needs approval'], ['Excess stock to move', `${C} 120k`, 'bundle offers ready']],
    happened: [`Rain from 09:30 in ${Z2} and ${Z3} favours hot food and ready meals.`, `Household excess is 9 days over target.`, `4 neighbourhoods in ${Z6} sit outside the 15-minute delivery area.`] }
];
const PNAME = Object.fromEntries(PERSONAS.map(p => [p.id, p.name]));
const PWHO = Object.fromEntries(PERSONAS.map(p => [p.id, p.who]));
PNAME.all = 'Every role'; PWHO.all = 'Program team';

/* ---------- the agents (35): id, owner, name, job, status, stage, finding, why, evidence, decision asked, effect on scorecard, optional edit control ---------- */
const AG = [];
function A(id, role, name, job, status, stage, finding, why, ev, ask, effect, edit) {
  AG.push({ id, role, name, job, status, stage: ST(stage), finding, why, ev, ask, effect: effect || {}, edit: edit || null });
}
/* Country head: 10 agents */
A('chief', 'all', 'Chief of Staff', 'Shared by every role. Writes each person\'s morning bulletin: what happened, the decisions for today, and routes questions to the right agents.', 'Found something', 'Learn',
  'Bulletin ready: 5 things happened overnight and 5 decisions are waiting for you.',
  'It reads what the other nine agents found since 22:00, ranks it by money and customer impact, and drops anything that does not need you.',
  ['9 agents reported since 22:00', '14 findings ranked, 5 kept', 'Ranked by sales at risk and time left to act'], 'Read the bulletin and confirm the order of priorities.', {});
A('analyst', 'all', 'Business Analyst', 'Shared by every role. Answers any why, what-if or how-much question across all areas, using the same data and method for everyone.', 'Watching', 'Learn',
  'Ready for questions. Latest: Zone 3 sales gap explained (about 70% empty shelves, 30% rain-slowed deliveries).',
  'It breaks a number into its drivers, tests what-ifs, and compares options. It works the same way whoever asks, and brings in functional agents when the answer needs their expertise.',
  ['Driver trees for all six scorecard numbers', 'What-if calculators on 6 decision types', 'Uses the same illustrative data as every other agent'], 'Nothing needed.', {});
A('pulse', 'ch', 'Market Pulse', 'Watches demand, weather, events and seasonality: what is moving in the market.', 'Found something', 'Forecast',
  `Rain from 09:30 in ${Z2} and ${Z3} usually lifts evening orders by about 12%.`,
  'It compares today with the last 10 rainy days and with this week\'s events calendar.',
  ['10 comparable rainy days, orders up 9% to 15%', 'Evening peak moves from 19:00 to 18:00', 'No competing local event found'],
  `Raise tonight's order forecast for ${Z2} and ${Z3} by 12%?`, { gmv: 21000 });
A('comp', 'ch', 'Competition Watch', 'Tracks competitor prices, promotions and range moves, and suggests a response.', 'Needs you', 'Pricing and margin',
  `Competitor X cut ${CAT_BEV} and ${CAT_DAIRY} prices by 15% for the weekend in 3 zones.`,
  'Prices dropped on 38 items we both sell. Our price gap went from +1% to +14% on those items, and these two categories are 21% of sales in those zones.',
  ['38 matching items checked at 06:10', 'Price gap +14% on 38 items (was +1%)', `${CAT_BEV} and ${CAT_DAIRY} are 21% of sales in those zones`],
  `Approve a response budget of ${C} 38,000 to match prices on 12 hero items this weekend?`, { gmv: 60000, margin: -0.1 },
  { type: 'number', label: 'Budget', value: 38000, unit: C });
A('voice', 'ch', 'Customer Voice', 'Reads repeat orders, complaints and reviews to explain why customers leave.', 'Found something', 'Customer',
  `Missing-item complaints rose from 3.1% to 4.2% of orders in ${Z3}.`,
  'It groups complaint reasons and links them to stock-outs. The rise matches the dairy gaps yesterday evening.',
  ['4.2% of orders had a missing item (was 3.1%)', '"Item unavailable" is 61% of the reasons', '1,150 customers affected yesterday evening'],
  `Send a ${C} 10 recovery voucher to the 1,150 affected customers (cost ${C} 11,500)?`, { repeat: 0.3 });
A('tower', 'ch', 'Availability Control Tower', 'Tracks stock-outs by zone and tags the cause: forecast, supplier, transfer or store.', 'Needs you', 'Store',
  `${CAT_DAIRY} availability in ${Z3} fell to 86%. Main cause: the late truck from ${SG}.`,
  'Of the lost shelf hours, 55% trace to the supplier, 20% to the forecast, 15% to transfers and 10% to the store.',
  ['86% available at 07:00 (usual 95%)', '55% supplier, 20% forecast, 15% transfer, 10% store', `${SG} truck due 06:00, now expected 09:00`],
  `Approve an expedited top-up from ${SG} and a stock move from ${Z2} to ${Z3}?`, { avail: 0.4, gmv: 14000 });
A('guard', 'ch', 'Margin Guardian', 'Finds margin leaks, price differences and supplier terms below our floor.', 'Needs you', 'Pricing and margin',
  `${SD}'s new cost list takes 14 items below the margin floor.`,
  'Cost rises 6.5% from the day after tomorrow. At today\'s shelf prices, margin on these 14 items falls from 24.0% to 19.1%, below the 21.0% floor.',
  ['14 items affected, all in ' + CAT_DAIRY, 'Margin 24.0% to 19.1% at current prices', `Estimated leak ${C} 6,200 a week if nothing changes`],
  `Ask the commercial lead to renegotiate with ${SD} before accepting the list?`, { margin: 0.04 });
A('cash', 'ch', 'Cash and Working Capital', 'Compares inventory days with payment days and flags excess stock and payment timing.', 'Needs you', 'Buy',
  `Inventory is 41 days against 36 payment days, so 5 days of cash are tied up.`,
  `Excess sits in ${CAT_HOME} and ${CAT_PACK}. Two suppliers could be paid later without penalty.`,
  [`Excess stock worth ${C} 310k above target`, `${CAT_HOME} is 9 days over target`, `${SK} allows payment on day 45 (we pay on day 30)`],
  `Pause new buys on 9 excess items and move ${SK} payment to day 45?`, { wc: -0.4 });
A('scout', 'ch', 'Growth Scout', 'Finds gaps in coverage, customers reached and range, and candidate areas for new stores.', 'Found something', 'Assortment',
  `${Z6} carries 18% fewer items than similar zones in ${CAT_FRESH} and ${CAT_CARE}.`,
  'It compares each zone with its closest look-alikes by customers, basket and weather.',
  ['3 look-alike zones carry 40 more items', 'Search "no result" rate 6.8% in ' + Z6, '4 neighbourhoods sit outside the 15-minute area'],
  `Test 40 added items in ${Z6} for four weeks?`, { gmv: 9000 });
A('ops', 'ch', 'Operations Pulse', 'Watches picker productivity, delivery readiness and staffing by hour.', 'Watching', 'Pick and pack',
  `Steady at 118 units per picker per hour. Evening staffing in ${Z5} is the one to watch.`,
  'It compares the order forecast with the shift plan every hour.',
  ['118 units per picker per hour (target 125)', `${Z5} is 2 pickers short from 18:00`, 'All other zones covered'],
  `Add 2 pickers to the ${Z5} evening shift?`, { pick: 4 });
A('risk', 'ch', 'Risk and Compliance', 'Watches supplier and data risks and escalates to the right team.', 'Needs you', 'Contract',
  `${SL}'s food licence expires in 12 days and 31 items are missing product data.`,
  'Selling food without a valid licence or complete product data can force items off the shelf.',
  ['Licence expiry in 12 days', '31 items without allergen data', `${SL} supplies 3.1% of sales`],
  `Escalate to Legal and the Catalogue team with a 7-day deadline?`, {});
/* Commercial lead and Catman */
A('cattask', 'cat', 'Catman Task Manager', 'A daily analyst: opportunities and worries for my portfolio.', 'Found something', 'Assortment',
  `3 opportunities and 2 worries in ${CAT_DAIRY} today.`,
  'It scans sales, price gaps, stock and supplier news for your categories every morning.',
  ['Opportunity: 6 yoghurt items missing in 4 zones', 'Worry: ' + SD + ' cost rise', 'Worry: cheese sales down 4% on competitor offer'],
  `Approve two follow-ups: renegotiate ${SD} and test 6 new yoghurt items?`, { gmv: 6000 });
A('negprep', 'cat', 'Supplier Negotiation Prep', 'Prepares the brief before every supplier meeting: asks, give-backs and fall-back.', 'Needs you', 'Contract',
  `Brief for ${SD} is ready: ask for 3% back-margin and a 60-day price hold.`,
  'It compares our share of their sales, their price against competitors and what we accepted last year.',
  [`We are ${SD}'s #3 customer`, 'Their price is 4% above the market on 9 items', 'Last year we accepted +3% with no price hold'],
  `Approve the negotiation brief for ${SD}?`, { margin: 0.03 });
A('fit', 'cat', 'Assortment Fit', 'Checks whether the range fits each zone and finds gaps against competitors.', 'Found something', 'Catalogue',
  `11 items sell below the cut-off in 4 zones and 6 competitor items are missing.`,
  'It scores every item on sales, margin and substitutes in each zone.',
  ['11 slow items, 4 zones', '6 competitor items with strong demand', 'Swapping them frees 38 shelf locations'],
  'Approve swapping 11 slow items for 6 new ones in the 4 zones?', { gmv: 7000 });
A('pcheck', 'cat', 'Price and Margin Check', 'Checks every price against cost, floor and competitors.', 'Watching', 'Pricing and margin',
  `412 prices checked since 06:00. 3 are below the floor and already sent to Margin Guardian.`,
  'It re-checks prices every time a cost or competitor price changes.',
  ['412 prices checked', '3 below floor', '0 differences between app and shelf label'], 'Nothing needed.', {});
A('credit', 'cat', 'Credit-Line Document Pack', 'Assembles the papers a supplier needs for a credit line.', 'Needs you', 'Contract',
  `${SK} pack is 9 of 11 documents complete.`,
  'It checks each document for validity and date. 2 are missing and 1 expires within 30 days.',
  ['9 of 11 documents ready', 'Missing: bank letter, insurance certificate', 'Tax certificate expires in 21 days'],
  `Ask ${SK} for the 2 missing documents and the new tax certificate?`, {});
/* Demand planner */
A('valid', 'dp', 'Data Validator', 'Checks sales and stock data before it feeds the forecast.', 'Found something', 'Forecast',
  '37 items have sales gaps after stores closed early; gaps were filled from the last 4 weeks.',
  'A store closing early looks like low demand unless it is flagged.',
  ['37 items, 5 stores', 'Filled using same weekday over 4 weeks', 'Largest gap: ' + CAT_BAKERY], 'Confirm the fills so the forecast can use them?', { avail: 0.1 });
A('fdoc', 'dp', 'Forecast Doctor', 'Detects bad forecasts and explains why.', 'Needs you', 'Forecast',
  `${CAT_FRESH} forecast in ${Z1} has been 28% too high for 3 days.`,
  'An old promotion is still counted in the baseline, so every day looks busier than it is.',
  ['Forecast 28% above sales, 3 days running', 'Promotion ended 12 days ago but still counted', 'Waste in the category up 1.2 points'],
  'Remove the old promotion from the baseline and re-run the forecast?', { margin: 0.05, avail: 0.1 });
A('campf', 'dp', 'Campaign Forecast', 'Forecasts demand for promotions and campaigns.', 'Found something', 'Forecast',
  `Weekend ${CAT_BEV} offer needs about 35% more volume than a normal weekend.`,
  'It uses the last 6 comparable offers and the competitor price gap.',
  ['6 comparable offers, +28% to +41%', 'Rain adds +4%', 'Supplier lead time is 3 days'], 'Approve the campaign forecast and pass it to buying?', { gmv: 8000 });
A('edrev', 'dp', 'Edit Reviewer', 'Scores manual forecast edits and asks for a reason.', 'Found something', 'Forecast',
  `Of 19 manual edits this week, 12 improved the forecast. 5 made no difference, 2 made it worse.`,
  'It compares each edit with what happened and checks for a written reason.',
  ['12 improved, 5 neutral, 2 worse', '5 edits had no reason', 'Worst: +40% on ice cream in rain'], 'Send a reminder to editors who skipped the reason?', {});
/* Buyer */
A('unblock', 'buy', 'Plan Unblocker', 'Finds missing supplier links and cost prices that block the buy plan.', 'Needs you', 'Buy',
  `27 buy lines are blocked: 19 missing supplier links and 8 missing cost prices.`,
  'Blocked lines drop out of tonight\'s order and become tomorrow\'s stock-outs.',
  ['19 links can be copied from last month', '8 cost prices need a supplier', 'Tonight\'s order cut-off is 17:00'], 'Approve filling the 19 links from last month\'s matches?', { avail: 0.2 });
A('pofu', 'buy', 'PO Follow-up', 'Chases supplier confirmation on every purchase order.', 'Found something', 'Supplier follow-up',
  '11 purchase orders are not confirmed after 24 hours.',
  'It sends reminders, then flags the ones that put availability at risk.',
  ['11 unconfirmed, 3 on key items', 'Reminder 1 sent at 08:00', `${SE} unconfirmed 3 days in a row`], 'Escalate the 3 key-item orders to the supplier manager?', { avail: 0.2 });
A('hday', 'buy', 'Holiday and Delivery Scheduler', 'Adjusts order days and delivery windows around holidays.', 'Watching', 'Supplier follow-up',
  `Next public holiday in 6 days. 14 supplier orders need to move earlier.`,
  'It checks supplier calendars and lead times.', ['14 orders to move', '2 suppliers closed 2 days', 'No action needed today'], 'Nothing needed.', {});
A('reply', 'buy', 'Supplier Reply Tracker', 'Logs what suppliers say and flags promises that are not kept.', 'Needs you', 'Supplier follow-up',
  `${SG} has not replied about the late truck. 3 others replied with new dates.`,
  'It reads supplier messages and keeps one record per order.',
  ['3 new delivery dates logged', `${SG}: no reply in 6 hours`, 'Promised dates kept: 74% this month'], `Call ${SG} now and ask for a firm delivery time?`, { avail: 0.3 });
/* Replenishment and warehouse */
A('transfer', 'wh', 'Transfer Planner', 'Builds the daily stock transfer plan and splits it by zone.', 'Needs you', 'Transfer',
  `Tomorrow's plan is ready: 62 moves across 4 zones.`,
  'It balances stock against tomorrow\'s forecast, truck space and shelf life.',
  ['62 moves, 4,380 units', `${Z3} gets the most: 1,150 units`, '2 counts uncertain'], 'Review and release tomorrow\'s transfer plan?', { avail: 0.3 });
A('inbd', 'wh', 'Inbound Scheduler', 'Books dock slots and keeps trucks from queueing.', 'Found something', 'Inbound',
  'Two trucks are booked on the same dock at 10:00.',
  'It matches slots to truck size and unloading time.', ['Dock 2 double-booked', 'Slot at 11:00 is free', 'No change to supplier times needed'], 'Move one truck to 11:00?', { avail: 0.1 });
A('acc', 'wh', 'Stock Accuracy', 'Compares shelf counts with the system and flags drift.', 'Found something', 'Store',
  `Shelf counts differ from the system by 3.8% for ${Z4} dairy.`,
  'Differences make the system think stock exists when the shelf is empty.', ['3.8% gap, 5 stores', 'Likely cause: unrecorded damage', 'Recount of 40 items suggested'], 'Request a recount of 40 dairy items in ' + Z4 + '?', { avail: 0.2 });
/* Dark-store manager */
A('coach', 'store', 'Picker Productivity Coach', 'Tracks units per picker per hour, plans the shift and suggests pick paths.', 'Needs you', 'Pick and pack',
  `Evening plan: move 2 pickers from stock work to picking at 18:00 and use the new pick path.`,
  'The evening peak arrives earlier because of rain. A shorter walking path saves time on 30% of orders.',
  ['Orders per hour peak 18:00 to 20:00', 'Walking is 34% of pick time', 'New path saves about 14 seconds per order'], 'Accept the evening shift plan and new pick path?', { pick: 6 });
A('resp', 'store', 'Stock-out Responder', 'Finds stock-outs in my store and proposes the quickest fix.', 'Needs you', 'Store',
  '6 items are out of stock in store Z3-02. Substitutes are ready.',
  'It checks the back room, nearby stores and substitutes in that order.',
  ['2 items in back room', '3 have a good substitute', '1 needs a transfer tonight'], 'Confirm the fixes for the 6 items?', { avail: 0.3, gmv: 4000 });
A('waste', 'store', 'Waste and Expiry Watch', 'Flags items about to expire and suggests markdowns.', 'Found something', 'Store',
  '48 bakery items expire tonight.', 'A 30% markdown after 17:00 usually sells most of them.', ['48 items, 6 products', 'Markdown 30% suggested at 17:00', `Waste cost ${C} 1,900 if unsold`], 'Approve a 30% markdown on 48 bakery items at 17:00?', { margin: 0.05 });
/* Finance */
A('inv', 'fin', 'Invoice Match', 'Matches supplier invoices to orders and goods received.', 'Found something', 'Inbound',
  `23 invoices do not match goods received. Total difference ${C} 18,400.`,
  'It compares price, quantity and date for every line.', ['14 price differences', '7 quantity differences', '2 duplicates'], 'Hold payment on the 23 invoices until suppliers respond?', { margin: 0.03 });
A('paytm', 'fin', 'Payment Timing', 'Plans when to pay each supplier within terms.', 'Needs you', 'Supplier follow-up',
  'Paying 9 invoices on the last allowed day instead of the first would hold cash for 11 more days.',
  'It reads each supplier\'s terms and any early-payment discount.', ['9 invoices, ' + C + ' 142k', 'No discount lost', 'Largest: ' + SK], 'Approve the new payment dates for 9 invoices?', { wc: -0.08 });
A('wca', 'fin', 'Working Capital Advisor', 'Shows where cash is tied up and what could release it.', 'Found something', 'Buy',
  `Excess stock above target is worth ${C} 310k, mostly ${CAT_HOME}.`,
  'It compares days of stock with target for every item.', [`${CAT_HOME}: ${C} 190k`, `${CAT_PACK}: ${C} 80k`, '9 items cover 70% of the excess'], 'Share the excess list with buyers and the growth lead?', { wc: -0.05 });
/* Growth */
A('camp', 'gro', 'Campaign Planner', 'Plans campaigns, offers and the messages that go with them.', 'Needs you', 'Customer',
  `Rainy-day campaign for ${Z2} and ${Z3}: hot food, ready meals and umbrellas.`,
  'It matches weather to what sold best on past rainy days.', ['Past rainy days: ready meals +34%', 'Cost ' + C + ' 4,500', 'Starts 11:00'], 'Approve the rainy-day campaign?', { gmv: 16000 });
A('excess', 'gro', 'Excess Stock Pusher', 'Finds ways to sell excess stock: bundles, offers, placement.', 'Found something', 'Customer',
  `${CAT_HOME} excess is 9 days over target. 4 bundle offers are ready.`,
  'It checks price, margin and which items customers buy together.', ['4 bundles, 38 items', 'Margin stays above floor', 'Excess reduced by about ' + C + ' 60k in 2 weeks'], 'Launch the 4 bundle offers?', { wc: -0.03 });
A('cov', 'gro', 'Coverage Scout', 'Finds neighbourhoods and zones where we could reach more customers.', 'Found something', 'Assortment',

  brief: el => { const id = el.dataset.id; const L = openLayer('drawer', 'Decision brief', () => briefHTML(id)); L.el.classList.add('wide'); },

  'pres-on': () => { S.pres.on = true; S.pres.i = 0; presGo(); },

  'pres-back': () => { if (S.pres.i > 0) { S.pres.i--; presGo(); } },
  'pres-action': () => PSTEPS[S.pres.i].action[1](),
  'pres-action2': () => PSTEPS[S.pres.i].action2[1](),

  'to-decision': el => { const a = AGM[el.dataset.id]; addDecision({ agent: a.id, agentName: a.name, role: a.role, title: a.finding, ask: a.ask, why: a.why, ev: a.ev, effect: a.effect, edit: a.edit, source: 'agent', an: a.id }); a.act.unshift(`${clock(S.sim.t)}  Turned the finding into a proposal`); toast('Proposal created and sent to ' + PNAME[a.role] + '.'); render(); },
  recheck: el => { const a = AGM[el.dataset.id]; a.act.unshift(`${clock(S.sim.t)}  Checked ${200 + (a.act.length * 137 + a.id.length * 53) % 1700} records, nothing new`); toast(a.name + ' checked again: nothing new.'); render(); },
  ask: el => { const i = +el.dataset.id, q = QA[i]; clearInterval(S.askT); S.ask = { i, n: reduced ? q.trail.length + 2 : 0 }; render(); if (!reduced) { S.askT = setInterval(() => { S.ask.n++; const o = $('#ask-out'); if (o) o.innerHTML = askOut(); if (S.ask.n >= q.trail.length + 2) clearInterval(S.askT); }, 700); } },
  assign: el => assignTask(+el.dataset.i, +el.dataset.j),
  'assign-all': el => { QA[+el.dataset.i].tasks.forEach((_, j) => assignTask(+el.dataset.i, j, true)); toast('All tasks assigned.'); render(); },
  'wf-run': el => wfRun(el.dataset.id), 'wf-step': el => { wfNext(el.dataset.id); render(); },
  'wf-pause': el => { const st = wfState(el.dataset.id); st.auto = false; clearTimeout(st.tm); render(); },
  'wf-reset': el => { wfReset(el.dataset.id); render(); },
  play: () => { S.sim.playing ? simPause() : simPlay(); updateDay(); },
  hour: () => { S.sim.t = Math.min(840, S.sim.t + 60); fireDay(); updateDay(); updateTop(); },
  restart: () => { simReset(); render(); },
  speed: el => { S.sim.speed = +el.dataset.id; render(); },
  world: el => { if (S.sim.world === el.dataset.id) return; S.sim.world = el.dataset.id; simReset(); simPlay(); S.sim.speed = Math.max(S.sim.speed, 4); render(); toast(el.dataset.id === 'ai' ? 'Replaying the same day in the AI-native world.' : 'Replaying the same day, done by hand.'); },
  inject: el => inject(el.dataset.id),

  csv: () => { const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const t = ['When,Who,Decision,Item,Agent,Workflow,Reason,Change'].concat(S.log.map(l => [l.time, l.who, VERB[l.kind], l.item, l.agent, l.wf || '', l.reason, l.change].map(q).join(','))).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = 'decision-log.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
