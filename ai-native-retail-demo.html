<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Native Retail Demo</title>
<script>
/* set theme before first paint */
(function(){var t='light';try{t=localStorage.getItem('ainr-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
:root{color-scheme:light;--bg:#f5f6f8;--surface:#fff;--surface2:#eef0f4;--ink:#161b22;--ink2:#465061;--ink3:#667182;--line:#dfe3ea;--accent:#2457d6;--accent2:#1c45ad;--on-accent:#fff;--accent-soft:#e6edfc;--good:#14764a;--good-soft:#e1f3ea;--warn:#8a5a00;--warn-soft:#fdf0d2;--crit:#b3261e;--crit-soft:#fbe6e4;--r:12px;--sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05)}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1319;--surface:#171c24;--surface2:#202733;--ink:#eaeef5;--ink2:#b0b9c7;--ink3:#8f99a9;--line:#2b3340;--accent:#7ba3ff;--accent2:#a3bfff;--on-accent:#0d1626;--accent-soft:#1c2a47;--good:#4cc790;--good-soft:#14301f;--warn:#f0b84a;--warn-soft:#352a10;--crit:#ff8a80;--crit-soft:#3a1c1a;--sh:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3,h4,p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.wrap{max-width:1260px;margin:0 auto;padding:0 24px}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;color:var(--ink);text-decoration:none;font-size:16px}
.logo{width:22px;height:22px;border-radius:7px;background:var(--accent);position:relative;display:inline-block}
.logo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--on-accent)}
.grow{flex:1}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.role select{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:600;max-width:230px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:4px 10px;border-radius:99px;background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
nav.tabs a{padding:9px 13px;text-decoration:none;color:var(--ink2);font-weight:550;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current=page]{color:var(--accent);border-color:var(--accent)}
.waiting-chip{font-size:13px;font-weight:650;padding:5px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
/* generic */
main{padding:28px 0 90px;outline:none}
.h1{font-size:clamp(26px,3.4vw,38px);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.h2{font-size:21px;font-weight:680;letter-spacing:-.01em}
.h3{font-size:16px;font-weight:650}
.muted{color:var(--ink2)}.small{font-size:13px}.faint{color:var(--ink3)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;min-height:40px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.bad{color:var(--crit)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-w{background:var(--surface2);color:var(--ink2)}
.s-f{background:var(--warn-soft);color:var(--warn)}
.s-n{background:var(--accent);color:var(--on-accent)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--surface2);color:var(--ink2)}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.crit{background:var(--crit-soft);color:var(--crit)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
/* hero + north star */
.hero{padding:34px 0 8px;max-width:900px}
.hero p{font-size:18px;margin-top:12px;color:var(--ink2);max-width:720px}
.flowwrap{overflow-x:auto;padding:6px 2px 14px;margin:0 -2px}
.flow{display:grid;grid-template-columns:repeat(13,minmax(116px,1fr));gap:0;min-width:max-content}
@media(min-width:1280px){.flow{min-width:0;grid-template-columns:repeat(13,minmax(0,1fr))}.node{padding:10px 8px;margin-right:8px}.node .nm{font-size:13px}.node::after{right:-9px;width:9px}}
.node{position:relative;margin:0 9px 0 0;padding:12px 11px;border:1px solid var(--line);background:var(--surface);border-radius:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:128px;box-shadow:var(--sh)}
.node::after{content:"";position:absolute;right:-10px;top:50%;width:10px;height:2px;background:var(--line)}
.node:last-child::after{display:none}
.node:hover,.node[aria-pressed=true]{border-color:var(--accent)}
.node[aria-pressed=true]{background:var(--accent-soft)}
.node .no{font-size:11px;color:var(--ink3);font-weight:700}
.node .nm{font-weight:650;font-size:14px;line-height:1.25}
.node .ct{font-size:12px;color:var(--ink2);margin-top:auto}
.node .dw{font-size:12px;font-weight:700;color:var(--accent)}
.node .dw.none{color:var(--ink3);font-weight:600}
.tagline{font-size:clamp(20px,2.4vw,26px);font-weight:650;letter-spacing:-.01em;margin:6px 0 4px}
.stat{padding:16px 18px}
.stat .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .l{font-size:13px;color:var(--ink2)}
/* agent card */
.agent{position:relative;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.agent:hover{border-color:var(--accent)}
.stretch{all:unset;cursor:pointer;font-weight:650;font-size:16px;line-height:1.3}
.stretch::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.stretch:focus-visible::after{outline:3px solid var(--accent);outline-offset:2px}
.agent .job{font-size:13px;color:var(--ink2)}
.agent .find{font-size:14px;margin-top:2px}
.agent .meta{margin-top:auto;font-size:12px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px;padding-top:6px}
/* decision card */
.dcard{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;background:var(--surface);padding:14px 16px}
.dcard .ask{margin-top:8px;padding:9px 12px;background:var(--accent-soft);border-radius:8px;font-weight:600;font-size:14px}
.dcard .why{font-size:13px;color:var(--ink2);margin-top:8px}
.ev{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.ev li{margin:2px 0}
.done-d{opacity:.8;border-left-color:var(--good)}.done-d.rej{border-left-color:var(--crit)}
/* kpi */
.kpi{position:relative;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.02em}
.kpi .l{font-size:13px;color:var(--ink2);font-weight:600}
.kpi svg{width:100%;height:34px;margin-top:6px}
.delta{font-size:12px;font-weight:650}
.delta.good{color:var(--good)}.delta.bad{color:var(--crit)}.delta.flat{color:var(--ink3)}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:var(--accent-soft)}100%{background:var(--surface)}}
/* lists */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border:0}
.feed time{font-variant-numeric:tabular-nums;color:var(--ink3);font-size:13px;font-weight:600}
.bul{list-style:none;margin:0;padding:0;counter-reset:b}
.bul li{counter-increment:b;display:grid;grid-template-columns:28px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.bul li:last-child{border:0}
.bul li::before{content:counter(b);width:24px;height:24px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
/* table */
.tw{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);font-weight:700;white-space:nowrap;background:var(--surface)}
.tbl th button{all:unset;cursor:pointer;font-weight:700}
.tbl th button:focus-visible{outline:3px solid var(--accent)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--surface2)}
/* bars */
.track{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.track>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.track.good>i{background:var(--good)}
.cmp{display:grid;grid-template-columns:70px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.cmp .track>i.bf{background:var(--ink3)}
/* forms */
label.f{display:block;font-size:13px;font-weight:650;margin-bottom:4px}
.in,textarea.in,select.in{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);}
textarea.in{min-height:84px;resize:vertical}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.switch button{border:0;background:transparent;padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.switch button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.radio{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-top:8px;cursor:pointer;align-items:flex-start}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.err{color:var(--crit);font-size:13px;font-weight:600;margin-top:6px}
/* layers */
.layer{position:fixed;inset:0;z-index:60;display:flex}
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.5)}
.layer .panel{position:relative;background:var(--surface);color:var(--ink);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);outline:none}
.layer.drawer{justify-content:flex-end}
.layer.drawer .panel{width:min(560px,100%);height:100%;border-left:1px solid var(--line)}
.layer.modal{align-items:center;justify-content:center;padding:16px}
.layer.modal .panel{width:min(600px,100%);max-height:92vh;border-radius:16px;border:1px solid var(--line)}
.pbody{padding:24px 24px 28px}
.x{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.anim .panel{animation:in .2s ease-out}
@keyframes in{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.layer.drawer.anim .panel{animation:inr .22s ease-out}
@keyframes inr{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);top:104px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:520px}
.t{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:550;box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* stepper / workflow */
.wfgrid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.wfgrid{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:8px 0;position:relative;font-size:14px}
.steps li::before{content:"";position:absolute;left:12px;top:30px;bottom:-8px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink3);z-index:1}
.steps li.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.steps li.cur .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.steps li.wait .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps li.todo{color:var(--ink3)}
.log{font-size:13px;list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.log li{display:grid;grid-template-columns:48px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.log time{color:var(--ink3);font-variant-numeric:tabular-nums}
.who{font-weight:650}
/* swimlane */
.lane{display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.lt{position:relative;height:16px;background:var(--surface2);border-radius:5px;overflow:hidden}
.lt i{position:absolute;top:0;bottom:0}
.lt .a{background:var(--warn);opacity:.75}.lt .b{background:var(--accent)}.lt .c{background:var(--good)}
.lt .cur{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.dtrack{position:relative;height:12px;border-radius:99px;background:var(--surface2)}
.dtrack>i.p{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.dtrack>b{position:absolute;top:-3px;width:3px;height:18px;border-radius:2px;background:var(--ink3);opacity:.7}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:4px}
/* tree */
.tree,.tree ul{list-style:none;margin:0;padding-left:0}
.tree ul{padding-left:18px;border-left:2px solid var(--line);margin-left:6px}
.tree li{margin:6px 0}
.tree details>summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:7px 10px;border-radius:8px;background:var(--surface2);list-style:none}
.tree details>summary::-webkit-details-marker{display:none}
.tree details>summary::before{content:"+";font-weight:700;width:14px;color:var(--ink3)}
.tree details[open]>summary::before{content:"\2212"}
.tree .leaf{padding:7px 10px;border-radius:8px;background:var(--surface2);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tree .val{font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}
/* presenter */
#presenter{position:fixed;right:16px;bottom:16px;z-index:50;width:min(380px,calc(100% - 32px))}
.pcard{padding:16px 18px;border:1px solid var(--accent)}
.dots{display:flex;gap:6px;margin:8px 0}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.spot{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px;animation:spot 1.6s ease-in-out 3}
@keyframes spot{50%{outline-color:transparent}}
.sc-btn{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.sc-btn span{font-weight:400;font-size:12.5px;color:var(--ink2)}
.pass,.fail{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.pass{background:var(--good-soft);color:var(--good)}.fail{background:var(--crit-soft);color:var(--crit)}
.callout{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:550}
footer{padding:20px 0 40px;color:var(--ink3);font-size:13px}
@media(max-width:640px){#toast{top:auto;bottom:16px}.wrap{padding:0 16px}.pbody{padding:20px 16px 24px}.top-in{gap:8px}.role select{max-width:160px}.lane{grid-template-columns:90px 1fr}#presenter{right:8px;bottom:8px;width:calc(100% - 16px)}.cmp{grid-template-columns:54px 1fr 54px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="wrap">
    <div class="top-in">
      <a class="brand" href="#/landing"><span class="logo" aria-hidden="true"></span><span>AI Native <span class="cn"></span></span></a>
      <span class="badge" title="All numbers, names and results in this demo are made up for illustration">Illustrative data</span>
      <span class="grow"></span>
      <span class="waiting-chip" id="waiting" aria-live="polite"></span>
      <label class="role"><span>Viewing as</span><select id="role" aria-label="Switch role"></select></label>
      <button class="btn sm" id="btn-pres" aria-pressed="false">Presenter mode</button>
      <button class="btn sm" id="btn-theme" aria-label="Switch between light and dark theme">Dark theme</button>
    </div>
    <nav class="tabs" id="nav" aria-label="Main sections"></nav>
  </div>
</header>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
<div id="presenter" hidden></div>
<div id="layers"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   SYNTHETIC DATA BLOCK  -  everything below is made up for illustration.
   Swap the placeholders in CONFIG / ZONES / SUPPLIERS / CATEGORIES first.
   Search the file for "BASELINES" to find the figures to replace with
   measured baselines later.
   ===================================================================== */
const CONFIG = { COUNTRY: '[COUNTRY]', CURRENCY: '[CURRENCY]', SEED: 20240611 };
const ZONES = ['Zone 1', 'Zone 2', 'Zone 3', 'Zone 4', 'Zone 5', 'Zone 6'];
const ZONE_SHARE = [0.22, 0.19, 0.17, 0.16, 0.14, 0.12];            // share of GMV, sums to 1
const SUPPLIERS = ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D', 'Supplier E', 'Supplier F', 'Supplier G', 'Supplier H', 'Supplier I', 'Supplier J', 'Supplier K', 'Supplier L'];
const CATEGORIES = ['Fresh produce', 'Dairy and eggs', 'Bakery', 'Meat and fish', 'Packaged food', 'Beverages', 'Household', 'Personal care'];
const C = CONFIG.CURRENCY;
const CTRY = CONFIG.COUNTRY;
const [Z1, Z2, Z3, Z4, Z5, Z6] = ZONES;
const [SA, SB, SC, SD, SE, SF, SG, SH, SI, SJ, SK, SL] = SUPPLIERS;
const [CAT_FRESH, CAT_DAIRY, CAT_BAKERY, CAT_MEAT, CAT_PACK, CAT_BEV, CAT_HOME, CAT_CARE] = CATEGORIES;

/* seeded generator so every reload shows the same numbers */
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(CONFIG.SEED);
const ri = (a, b) => Math.round(a + R() * (b - a));

    return `<div class="grid" style="grid-template-columns:minmax(180px,1.2fr) 2fr minmax(210px,1fr);gap:16px;align-items:center;border-top:1px solid var(--line);padding-top:12px"><div><b>${r.m}</b><div class="small faint">${r.dir === 'lower' ? 'Lower is better' : 'Higher is better'}</div></div>
    <div><div class="cmp"><span class="small faint">Before</span><div class="track"><i style="width:${r.b / mx * 100}%;background:var(--ink3)"></i></div><b>${r.b}${r.u}</b></div><div class="cmp"><span class="small faint">After</span><div class="track good"><i style="width:${r.a / mx * 100}%"></i></div><b>${r.a}${r.u}</b></div></div>
    <div class="row"><label class="small" for="r${key}">Pass if ${r.dir === 'lower' ? 'at most' : 'at least'}</label><input class="in" style="width:80px" id="r${key}" type="number" step="any" value="${rule}" data-input="rule" data-g="${gi}" data-r="${ri_}"><span id="res${key}" class="${ok ? 'pass' : 'fail'}">${ok ? 'Pass' : 'Fail'}</span></div></div>`; }).join('')}</div></section>`).join('')}</div>
  <p class="callout" style="margin-top:16px">One test is shown failing on purpose. A demo where everything passes is not believable; the failing tests are the ones to improve first.</p>`;

/* ---------- presenter ---------- */
const PSTEPS = [
  { t: '1. Landing: the north star', time: '0:00 to 0:45', say: 'This is one chain from supplier to shelf. Each stage shows how many agents work there and how many decisions are waiting for a person. Agents do the routine; people decide what matters.', go: () => nav('landing'), spot: '.flowwrap' },
  { t: '2. Country head: morning bulletin', time: '0:45 to 1:45', say: 'Here is the country head at 06:00. Left: what happened. Right: the decisions that need you, each with the evidence and the ask. Open Chief of Staff or any agent card to see why.', go: () => { S.persona = 'ch'; nav('home'); }, spot: '#bulletin' },
  { t: '3. Play one scenario', time: '1:45 to 3:00', say: 'A truck from the dairy supplier is three hours late. Watch four agents react in a chain and decisions land in the inboxes of the replenishment lead and the store manager. The scorecard moves.', go: () => { nav('day'); S.sim.world = 'ai'; if (!S.pres.did3) { S.pres.did3 = true; setTimeout(() => { inject('truck'); simPlay(); S.sim.speed = 4; render(); }, 500); } }, spot: '#d-scen' },
  { t: '4. Approve a decision', time: '3:00 to 3:45', say: 'Back to the country head. Approve the Availability Control Tower proposal: expedite the top-up and move stock. A reason is required, and it goes into the decision log.', go: () => { S.persona = 'ch'; nav('home'); simPause(); }, spot: '[data-did="d-tower"]', action: ['Open this decision', () => { if (S.dec.find(d => d.id === 'd-tower' && d.status === 'open')) openDecide('d-tower', 'approve'); else toast('Already decided. Open the decision log to see it.'); }] },
  { t: '5. Before and after', time: '3:45 to 4:30', say: 'Each workflow has a test agreed up front. Two of three pass for transfers; one fails on purpose, to show where we still need to improve. All figures are illustrative until replaced by measured baselines.', go: () => nav('compare'), spot: '#ba' },
  { t: '6. Close on the north star', time: '4:30 to 5:00', say: 'The ask: sponsor the first end-to-end chain in one market, measure each workflow against its test, and let agents handle the routine so your people can decide what matters.', go: () => nav('landing'), spot: '.flowwrap' }
];
function presHTML() {
  const i = S.pres.i, p = PSTEPS[i];
  return `<div class="card pcard" role="region" aria-label="Presenter panel"><div class="row" style="justify-content:space-between"><span class="eyebrow">Presenter mode</span><span class="small faint">${p.time}</span></div>
  <h2 class="h3" style="margin-top:4px">${p.t}</h2><div class="dots" aria-hidden="true">${PSTEPS.map((_, j) => `<i class="${j <= i ? 'on' : ''}"></i>`).join('')}</div>
  <p class="small muted">${p.say}</p>
  <div class="row" style="margin-top:10px"><button class="btn sm" data-act="pres-back" ${i === 0 ? 'disabled' : ''}>Back</button><button class="btn pri sm" data-act="pres-next">${i === PSTEPS.length - 1 ? 'Finish' : 'Next'}</button>${p.action ? `<button class="btn sm" data-act="pres-action">${p.action[0]}</button>` : ''}<span class="grow"></span><button class="btn sm" data-act="pres-off" aria-label="Close presenter">Close</button></div></div>`;
}
function presRender() { const el = $('#presenter'); el.hidden = !S.pres.on; $('#btn-pres').setAttribute('aria-pressed', S.pres.on); if (S.pres.on) el.innerHTML = presHTML(); }
function presGo() { const p = PSTEPS[S.pres.i]; p.go(); presRender(); setTimeout(() => { const t = $(p.spot); if (t) { t.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' }); t.classList.add('spot'); setTimeout(() => t.classList.remove('spot'), 5200); } }, 350); }

/* ---------- shell: routing, render, events ---------- */
const NAV = [['landing', 'North star'], ['home', 'Home'], ['score', 'Scorecard'], ['flows', 'Workflows'], ['day', 'Day in the life'], ['agents', 'Agent portfolio'], ['log', 'Decision log'], ['compare', 'Before and after']];
function nav(r, arg) { const h = '#/' + r + (arg ? '/' + arg : ''); if (location.hash === h) route(); else location.hash = h; }
function route() { const m = location.hash.replace(/^#\/?/, '').split('/'); S.route = V[m[0]] ? m[0] : 'landing'; S.arg = m[1] || null; window.scrollTo(0, 0); render(); document.title = 'AI Native Retail Demo'; }
function updateTop() {
  $('#role').value = S.persona; const n = openDec(S.persona).length; const w = $('#waiting'); if (w) w.textContent = `${n} decision${n === 1 ? '' : 's'} waiting for you`;
}
function render() {
  const f = document.activeElement, key = f && f.dataset && f.dataset.act ? f : null;
  const sy = window.scrollY;
  $('#nav').innerHTML = NAV.map(([r, l]) => `<a href="#/${r}" ${(S.route === r || (r === 'flows' && S.route === 'flow')) ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  $('#view').innerHTML = (V[S.route] || V.landing)(S.arg) + `<footer>All data in this demo is illustrative and synthetic. Placeholders such as ${CTRY}, ${C}, zones and suppliers are set at the top of the file. <button class="btn sm" data-act="reset-demo">Reset demo</button></footer>`;
  S.flash = {}; updateTop(); LAY.forEach(L => { if (L.el.classList.contains('drawer')) L.refresh(); }); presRender();
  if (S.route === 'day') { ['#d-feed', '#d-inbox'].forEach(s => { const e = $(s); e && delete e.dataset.sig; }); updateDay(); }
  window.scrollTo(0, sy);
  if (key && !LAY.length) { let sel = `[data-act="${key.dataset.act}"]`; if (key.dataset.id != null) sel += `[data-id="${key.dataset.id}"]`; if (key.dataset.k != null) sel += `[data-k="${key.dataset.k}"]`; const el = $(sel); if (el && !el.disabled) el.focus({ preventScroll: true }); }
}
const ACT = {
  'close-layer': () => closeLayer(),
  stage: el => { S.stage = S.stage === +el.dataset.id ? null : +el.dataset.id; render(); },
  agent: el => { const id = el.dataset.id; openLayer('drawer', AGM[id].name, () => agentHTML(id)); },
  metric: el => { const k = el.dataset.id; openLayer('drawer', METRIC[k].name + ' drivers', () => metricHTML(k)); },
  decide: el => openDecide(el.dataset.id, el.dataset.k),
  chip: el => { const t = $('#reason'); t.value = el.dataset.text; t.focus(); },
  confirm: el => {
    const reason = $('#reason').value.trim(), kind = el.dataset.k, err = $('#derr'); let chg = '';
    if (kind === 'edit') { const c = $('#chg'); chg = c ? c.value.trim() : ($('input[name=chg]:checked') || {}).value || ''; if (!chg) { err.textContent = 'Please enter your change.'; err.hidden = false; (c || $('#reason')).focus(); return; } }
    if (!reason) { err.textContent = 'A reason is required so the decision log is useful later.'; err.hidden = false; $('#reason').focus(); return; }
    decide(el.dataset.id, kind, reason, chg); closeLayer(); render();
  },
  'persona-go': el => { S.persona = el.dataset.id; $('#role').value = S.persona; nav('home'); },
  'pres-on': () => { S.pres.on = true; S.pres.i = 0; presGo(); },
  'pres-off': () => { S.pres.on = false; presRender(); },
  'pres-next': () => { if (S.pres.i >= PSTEPS.length - 1) { S.pres.on = false; presRender(); toast('Guided path finished.'); } else { S.pres.i++; presGo(); } },
  'pres-back': () => { if (S.pres.i > 0) { S.pres.i--; presGo(); } },
  'pres-action': () => PSTEPS[S.pres.i].action[1](),
  'read-bulletin': () => { AGM.chief.status = 'Watching'; AGM.chief.last = 'Bulletin read ' + clock(S.sim.t); AGM.chief.act.unshift(`${clock(S.sim.t)}  Bulletin read by the Country head`); toast('Bulletin marked as read.'); render(); },
  'to-decision': el => { const a = AGM[el.dataset.id]; addDecision({ agent: a.id, agentName: a.name, role: a.role, title: a.finding, ask: a.ask, why: a.why, ev: a.ev, effect: a.effect, edit: a.edit, source: 'agent' }); a.act.unshift(`${clock(S.sim.t)}  Turned the finding into a proposal`); toast('Proposal created and sent to ' + PNAME[a.role] + '.'); render(); },
  recheck: el => { const a = AGM[el.dataset.id]; a.act.unshift(`${clock(S.sim.t)}  Checked ${200 + (a.act.length * 137 + a.id.length * 53) % 1700} records, nothing new`); toast(a.name + ' checked again: nothing new.'); render(); },
  ask: el => { const i = +el.dataset.id, q = QA[i]; clearInterval(S.askT); S.ask = { i, n: reduced ? q.trail.length + 2 : 0 }; render(); if (!reduced) { S.askT = setInterval(() => { S.ask.n++; const o = $('#ask-out'); if (o) o.innerHTML = askOut(); if (S.ask.n >= q.trail.length + 2) clearInterval(S.askT); }, 700); } },
  assign: el => assignTask(+el.dataset.i, +el.dataset.j),
  'assign-all': el => { QA[+el.dataset.i].tasks.forEach((_, j) => assignTask(+el.dataset.i, j, true)); toast('All tasks assigned.'); render(); },
  'wf-run': el => wfRun(el.dataset.id), 'wf-step': el => { wfNext(el.dataset.id); render(); },
  'wf-pause': el => { const st = wfState(el.dataset.id); st.auto = false; clearTimeout(st.tm); render(); },
  'wf-reset': el => { wfReset(el.dataset.id); render(); },
  play: () => { S.sim.playing ? simPause() : simPlay(); updateDay(); },
  hour: () => { S.sim.t = Math.min(840, S.sim.t + 60); fireDay(); updateDay(); updateTop(); },
  restart: () => { simReset(); render(); },
  speed: el => { S.sim.speed = +el.dataset.id; render(); },
  world: el => { if (S.sim.world === el.dataset.id) return; S.sim.world = el.dataset.id; simReset(); simPlay(); S.sim.speed = Math.max(S.sim.speed, 4); render(); toast(el.dataset.id === 'ai' ? 'Replaying the same day in the AI-native world.' : 'Replaying the same day, done by hand.'); },
  inject: el => inject(el.dataset.id),
  sort: el => { const k = el.dataset.id; S.sort = { k, d: S.sort.k === k ? -S.sort.d : 1 }; render(); },
  csv: () => { const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; const t = ['When,Who,Decision,Item,Agent,Workflow,Reason,Change'].concat(S.log.map(l => [l.time, l.who, VERB[l.kind], l.item, l.agent, l.wf || '', l.reason, l.change].map(q).join(','))).join('\n'); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv' })); a.download = 'decision-log.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  'reset-demo': () => location.reload()
};
function assignTask(i, j, quiet) {
  const k = i + '-' + j; if (S.assigned[k]) return; S.assigned[k] = 1; const [r, t] = QA[i].tasks[j];
  addDecision({ role: r, agentName: 'Country head', title: 'Task from the country head: ' + t, ask: 'Accept this task?', why: `Raised from the question "${QA[i].q}" after a short review by your agents.`, ev: QA[i].trail.map(([id, x]) => AGM[id].name + ': ' + x).slice(0, 2), source: 'task' });
  if (!quiet) { toast('Task sent to ' + PNAME[r] + '.'); render(); }
}
const CHG = {
  pflt: el => { S.pflt = el.value; render(); }, lrole: el => { S.flt.role = el.value; render(); }, lwf: el => { S.flt.wf = el.value; render(); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHG[el.dataset.change]) CHG[el.dataset.change](el); });
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input="rule"]'); if (!el) return;
  const g = +el.dataset.g, r = +el.dataset.r, v = el.value, row = BA[g].rows[r]; S.ba[g + '-' + r] = v; const ok = baPass(row, v), res = $('#res' + g + '-' + r);
  res.className = ok ? 'pass' : 'fail'; res.textContent = ok ? 'Pass' : 'Fail';
});
window.addEventListener('hashchange', route);
$('#role').innerHTML = PERSONAS.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
$('#role').addEventListener('change', e => { S.persona = e.target.value; if (S.route === 'landing' || S.route === 'flow') nav('home'); else render(); });
$('#btn-pres').addEventListener('click', () => { S.pres.on ? ACT['pres-off']() : ACT['pres-on'](); });
function setTheme(t) { document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('ainr-theme', t); } catch (e) { } $('#btn-theme').textContent = t === 'dark' ? 'Light theme' : 'Dark theme'; }
$('#btn-theme').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
setTheme(document.documentElement.getAttribute('data-theme'));
$$('.cn').forEach(e => e.textContent = CTRY);
document.addEventListener('visibilitychange', () => { if (document.hidden && S.sim.playing) simPause(); });
route();
</script>
</body>
</html>
